<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Flexbox excersice - Card with pager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
   <article class="card">
       <h1 class="quote">“If debugging is the process of removing software bugs, then programming must be the process of putting them in.”</h1>
       <p class="author">Edsger Dijkstra</p>
       <footer>
            <svg display="none">
                <defs>
                    <g id="dots">
                        <a href="#">
                            <circle
                            cx=50
                            cy=50
                            r=40
                            
                            >
                            </circle>
                        </a>
                    </g>
                
                </defs>
            </svg>
            <!-- First dot-->
            <svg display="none" viewBox="0 0 100 100" class= "dot">
                <use class="circle1" href="#dots"></use>
            </svg>
            <!-- Second dot -->
            <svg display="none" viewBox="0 0 100 100" class="dot">
                <use class="circle1" href="#dots"></use>
            </svg>
            <!-- Third dot-->
            <svg viewBox="0 0 100 100" class="dot">
                <use class="circle1" href="#dots"></use>
            </svg>
       </footer>
   </article>
<!--1234567-->
</body>
</html>
